services:

  #
  # Infrastructure
  #

  mosquitto:
    image: docker.io/eclipse-mosquitto:2.0.18
    container_name: mosquitto
    command:
      - mosquitto
      - -c
      - /mosquitto-no-auth.conf
    ports:
      - 1883:1883

  #
  # Knowledgebase
  #

  knowledgebase:
    image: sense-core/knowledgebase:v1.0
    container_name: knowledgebase
    privileged: true
    ports:
      - 7200:7200
      - 7300:7300
    volumes:
      - ./config/config.docker.json:/opt/knowledgebase/config.json:ro
      - ./infrastructure/knowledgebase/data/:/opt/knowledgebase/data/:ro
      - ./infrastructure/knowledgebase/graphdb_repo_config.ttl:/opt/knowledgebase/graphdb_repo_config.ttl:ro
      
  #
  # Semantic Event Log
  #

  semantic-event-log-bridge:
    container_name: semantic-event-log-bridge
    image: sense-core/semantic-event-log-bridge:v1.0
    volumes:
      - ./config/config.docker.json:/opt/semantic-event-log_bridge/config/semantic_event_log_bridge.docker.json:ro
  
  #
  # Services
  #

  simple-event-detection:
    container_name: simple-event-detection
    image: sense-core/simple-event-detection:v1.0
    volumes:
      - ./config/config.docker.json:/opt/monitoring-service/config.json:ro
  
  #
  # Data Ingestion
  #

  data-ingestion:
    container_name: data-ingestion
    image: sense-core/data-ingestion:v1.0
    volumes:
      - ./config/config.docker.json:/opt/data-ingestion/config.json:ro
  
  #
  # Event to State Causality
  #
  
  event-to-state-causality:
    container_name: event-to-state-causality
    image: sense-core/event-to-state-causality:v1.0
    volumes: 
      - ./config/config.docker.json:/opt/event-to-state-causality/config.json:ro
      
  #
  # Explanation Interface
  #
  
  explanation-interface:
    container_name: explanation-engine
    image: sense-core/explanation-interface:v1.0
    volumes: 
      - ./config/config.docker.json:/opt/explanation-interface/config.json:ro
    ports:
      - 5001:5001  